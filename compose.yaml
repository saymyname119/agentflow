services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: approvalflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: approvalflow
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://approvalflow:${POSTGRES_PASSWORD}@db:5432/approvalflow
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10
  worker:
    build: .
    command: ["approvalflow", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://approvalflow:${POSTGRES_PASSWORD}@db:5432/approvalflow
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
