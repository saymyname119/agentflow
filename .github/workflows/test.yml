name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: review-console
          path: frontend/dist
  test:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: approvalflow
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: approvalflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - uses: actions/download-artifact@v4
        with:
          name: review-console
          path: frontend/dist
      - name: SQLite tests
        if: matrix.database == 'sqlite'
        run: pytest -q
      - name: PostgreSQL tests
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://approvalflow:test-only-password@localhost:5432/approvalflow_test
        run: pytest -q
      - run: python evaluation/run.py
