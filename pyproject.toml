[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "approvalflow"
version = "0.3.0"
description = "Evidence-based GitHub pull-request approval triage with human oversight"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
approvalflow = "approvalflow.cli:main"

[tool.setuptools.packages.find]
include = ["approvalflow*"]

[tool.setuptools.package-data]
approvalflow = ["web/index.html", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
